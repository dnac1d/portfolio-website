.hover-scale {

    <script>
        feather.replace();
        
        // Enhanced floating smiley animation with drag and throw functionality
        document.addEventListener('DOMContentLoaded', function() {
            const smileys = document.querySelectorAll('.floating-smiley');
            let isDragging = false;
            let currentElement = null;
            let offsetX = 0;
            let offsetY = 0;
            let velocityX = 0;
            let velocityY = 0;
            let lastX = 0;
            let lastY = 0;
            let lastTime = 0;
            let animationFrameId = null;

            // Set random initial positions
            smileys.forEach(smiley => {
                const speed = parseFloat(smiley.getAttribute('data-speed'));
                const viewportWidth = window.innerWidth - 100;
                const viewportHeight = window.innerHeight - 100;
                
                const randomX = Math.random() * viewportWidth;
                const randomY = Math.random() * viewportHeight;
                
                smiley.style.left = `${randomX}px`;
                smiley.style.top = `${randomY}px`;
                smiley.style.animationDuration = `${20 / speed}s`;
                smiley.style.cursor = 'grab';
                
                // Make elements draggable
                smiley.addEventListener('mousedown', startDrag);
                smiley.addEventListener('touchstart', startDrag);
                
                // Pause on hover
                smiley.addEventListener('mouseenter', function() {
                    this.style.opacity = '0.8';
                });
                
                smiley.addEventListener('mouseleave', function() {
                    this.style.opacity = this.getAttribute('data-speed') === '3' ? '0.6' : 
                                       this.getAttribute('data-speed') === '1.5' ? '0.5' : '0.4';
                });
            });

            function startDrag(e) {
                e.preventDefault();
                isDragging = true;
                currentElement = e.target.closest('.floating-smiley');
                
                const rect = currentElement.getBoundingClientRect();
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                
                currentElement.style.animationPlayState = 'paused';
                currentElement.style.cursor = 'grabbing';
                currentElement.style.zIndex = '1000';
                
                lastX = clientX;
                lastY = clientY;
                lastTime = Date.now();
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag);
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                if (!isDragging || !currentElement) return;
                
                e.preventDefault();
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                // Calculate velocity
                const currentTime = Date.now();
                const deltaTime = currentTime - lastTime;
                
                if (deltaTime > 0) {
                    velocityX = (clientX - lastX) / deltaTime * 16;
                    velocityY = (clientY - lastY) / deltaTime * 16;
                }
                
                lastX = clientX;
                lastY = clientY;
                lastTime = currentTime;
                
                // Update position
                currentElement.style.left = `${clientX - offsetX}px`;
                currentElement.style.top = `${clientY - offsetY}px`;
                currentElement.style.transform = 'scale(1.1)';
            }

            function stopDrag() {
                if (!isDragging || !currentElement) return;
                
                isDragging = false;
                currentElement.style.cursor = 'grab';
                currentElement.style.zIndex = '';
                currentElement.style.transform = '';
                // Apply throw force
                if (Math.abs(velocityX) > 0.05 || Math.abs(velocityY) > 0.05) {
                    throwElement(currentElement, velocityX, velocityY);
                } else {
                    currentElement.style.animationPlayState = 'running';
                }
document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);
                
                currentElement = null;
            }
            function throwElement(element, vx, vy) {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
                
                let posX = parseFloat(element.style.left);
                let posY = parseFloat(element.style.top);
                const friction = 0.8; // Increased friction for quicker stopping
                // Increase throw force slightly
                vx *= 0.5;
                vy *= 0.5;
function animateThrow() {
                    posX += vx;
                    posY += vy;
                    
                    // Apply friction
                    vx *= friction;
                    vy *= friction;
                    
                    // Boundary checking
                    const maxX = window.innerWidth - element.offsetWidth;
                    const maxY = window.innerHeight - element.offsetHeight;
                    
                    if (posX < 0) {
                        posX = 0;
                        vx = -vx * 0.6; // Reduced bounce
                    } else if (posX > maxX) {
                        posX = maxX;
                        vx = -vx * 0.6; // Reduced bounce
                    }
                    
                    if (posY < 0) {
                        posY = 0;
                        vy = -vy * 0.6; // Reduced bounce
                    } else if (posY > maxY) {
                        posY = maxY;
                        vy = -vy * 0.6; // Reduced bounce
                    }
                    
                    element.style.left = `${posX}px`;
                    element.style.top = `${posY}px`;
                    // Continue animation if still moving (lower threshold for longer throw)
                    if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
                        animationFrameId = requestAnimationFrame(animateThrow);
                    } else {
                        element.style.animationPlayState = 'running';
                        animationFrameId = null;
                    }
}
                
                animationFrameId = requestAnimationFrame(animateThrow);
            }
// Simple scroll animation
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-fade-in');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.hover-scale').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
