<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dana baqer | Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="https://unpkg.com/feather-icons"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { primary: '#dc2626', secondary: '#000000' },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    }
  }
}

<style>
.hover-scale { transition: transform 0.3s ease; }
.hover-scale:hover { transform: scale(1.05); }

/* Masonry layout using CSS columns */
.masonry-grid {
  column-count: 3;
  column-gap: 3rem;
}
.masonry-item {
  display: inline-block;
  width: 100%;
  margin-bottom: 3rem;
  transition: transform 0.3s ease;
}
.masonry-item img {
  width: 100%;
  display: block;
  object-fit: cover;
  vertical-align: top;
}
.masonry-item:hover { transform: scale(1.02); }

/* Responsive columns */
@media (max-width:1024px) { .masonry-grid { column-count: 2; } }
@media (max-width:768px) { .masonry-grid { column-count: 1; } }
</style>
</head>
<body class="bg-white font-sans">

<!-- Navigation -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between items-center h-16">
<div class="flex items-center space-x-2 select-none">
<a href="index.html"><img src="https://huggingface.co/spaces/dnac1d/nastyfront-studio/resolve/main/images/smiley.png" alt="Logo" class="w-8 h-8"></a>
<a href="index.html" class="text-primary font-bold text-2xl tracking-tight hover-scale">dana baqer</a>
</div>
<div class="hidden md:flex space-x-8 select-none">
<a href="gallery.html" class="text-primary font-medium">gallery</a>
<a href="about.html" class="text-gray-600 hover:text-primary transition-colors duration-300 font-medium">about</a>
</div>
<div class="md:hidden select-none">
<button class="text-gray-600 hover:text-primary transition-colors"><i data-feather="menu"></i></button>
</div>
</div>
</div>
</nav>

<!-- Gallery Content -->
<main class="pt-20 min-h-screen bg-white">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
<div class="masonry-grid"></div>
</div>
</main>

<!-- Footer -->
<footer class="bg-white border-t border-gray-200 mt-12">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
<div class="flex justify-between items-center">
<div class="text-gray-500 text-sm">© 2025 dana baqer. All rights reserved.</div>
<div class="flex space-x-4">
<a href="https://www.instagram.com/nastyscientist" class="text-gray-400 hover:text-primary transition-colors"><i data-feather="instagram"></i></a>
</div>
</div>
</div>
</footer>

<script>
feather.replace();

document.addEventListener('DOMContentLoaded', function() {
  const masonryGrid = document.querySelector('.masonry-grid');
    const images = [
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1828.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1865.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1867.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1868.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1870.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_1871.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_2045.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/IMG_2048.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%2011.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%203.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%204.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%205.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%206.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%207.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork%208.PNG?raw=true",
    "https://huggingface.co/datasets/dnac1d/pictures/resolve/main/Untitled_Artwork.JPG?raw=true"
    ];

  images.forEach((src,index)=>{
    const item=document.createElement('div');
    item.className='masonry-item';
    const img=document.createElement('img');
    img.src=src;
    img.alt=`Artwork ${index+1}`;
    item.appendChild(img);
    masonryGrid.appendChild(item);
  });
});
</script>
</body>
</html>
